<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gsa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="gsa-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.7" />
    </linearGradient>

    <!-- Cyan-Blue Text Gradient -->
    <linearGradient id="gsa-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="gsa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#gsa-bg)" stroke="url(#gsa-border)" stroke-width="12" />

  <!-- Inner Soft Bevel Ring -->
  <rect x="22" y="22" width="468" height="468" rx="104" ry="104" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.25" />

  <!-- Embedded High-Resolution Logo Image for 1:1 Pixel Match -->
  <image href="/assets/geleza-logo.png" x="18" y="18" width="476" height="476" preserveAspectRatio="xMidYMid meet" />
</svg>
