<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Fusion High</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="card">
        <h2>Reset Password</h2>

        <!-- Step 1: Request OTP -->
        <div id="step1">
            <p>Please enter your registered email address to receive a verification code.</p>
            <input type="email" id="email" placeholder="Email Address" required>
            <button type="button" onclick="requestOTP()">Get Reset Code</button>
        </div>

        <!-- Step 2: Verify and Reset -->
        <div id="step2" class="hidden">
            <p>Enter the 4-digit code sent to your email.</p>
            <input type="text" id="otp" placeholder="4-digit Code" maxlength="4" required>
            <button type="button" onclick="verifyOTP()">Verify Code</button>
        </div>

        <!-- Step 3: Change Password -->
        <div id="step3" class="hidden">
            <p>Choose your new secure password (take your time, no time limit).</p>
            <div style="position:relative; margin-bottom: 8px;">
                <input type="password" id="newPassword" placeholder="New Password" required style="width:100%; padding-right:38px;">
                <button type="button" onclick="const f=document.getElementById('newPassword'); const isPw=f.type==='password'; f.type=isPw?'text':'password'; this.innerHTML=isPw?'<i class=\'fas fa-eye-slash\'></i>':'<i class=\'fas fa-eye\'></i>';" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; color:#94a3b8; cursor:pointer; font-size:14px;" title="Toggle Password Visibility"><i class="fas fa-eye"></i></button>
            </div>
            <div style="position:relative; margin-bottom: 8px;">
                <input type="password" id="confirmNewPassword" placeholder="Confirm New Password" required style="width:100%; padding-right:38px;">
                <button type="button" onclick="const f=document.getElementById('confirmNewPassword'); const isPw=f.type==='password'; f.type=isPw?'text':'password'; this.innerHTML=isPw?'<i class=\'fas fa-eye-slash\'></i>':'<i class=\'fas fa-eye\'></i>';" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; color:#94a3b8; cursor:pointer; font-size:14px;" title="Toggle Password Visibility"><i class="fas fa-eye"></i></button>
            </div>
            <button type="button" onclick="resetPassword()">Update Password</button>
        </div>

        <div id="status-msg"></div>
        <a href="/" class="nav-link">Return to Login</a>
    </div>

    <script>
        const statusMsg = document.getElementById('status-msg');

        async function requestOTP() {
            const emailInput = document.getElementById('email');
            const btn = document.querySelector('#step1 button');
            
            if (!emailInput.value) {
                statusMsg.innerText = "Please enter your email.";
                statusMsg.style.color = "#3b82f6";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Sending...";

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput.value })
                });
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                    statusMsg.style.color = '#27ae60';
                } else {
                    statusMsg.style.color = '#3b82f6';
                }
                statusMsg.innerText = data.message || data.error;
            } catch (err) {
                statusMsg.innerText = "Connection error. Is the server running?";
                statusMsg.style.color = '#e74c3c';
            } finally {
                btn.disabled = false;
                btn.innerText = "Get Reset Code";
            }
        }

        async function verifyOTP() {
            const email = document.getElementById('email').value;
            const code = document.getElementById('otp').value;
            const btn = document.querySelector('#step2 button');

            btn.disabled = true;
            btn.innerText = "Verifying...";

            try {
                const response = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('step2').classList.add('hidden');
                    document.getElementById('step3').classList.remove('hidden');
                    statusMsg.style.color = '#27ae60';
                } else {
                    statusMsg.style.color = '#3b82f6';
                }
                statusMsg.innerText = data.message || data.error;
            } catch (err) {
                console.error(err);
                statusMsg.innerText = "Connection error. Check console.";
                statusMsg.style.color = '#e74c3c';
            } finally {
                btn.disabled = false;
                btn.innerText = "Verify Code";
            }
        }

        async function resetPassword() {
            const email = document.getElementById('email').value;
            const code = document.getElementById('otp').value;
            const new_password = document.getElementById('newPassword').value;
            const confirm_password = document.getElementById('confirmNewPassword').value;

            if (new_password !== confirm_password) {
                statusMsg.innerText = "Passwords do not match.";
                statusMsg.style.color = '#3b82f6';
                return;
            }

            const response = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code, new_password })
            });
            const data = await response.json();
            statusMsg.style.color = response.ok ? '#27ae60' : '#3b82f6';
            if (response.ok) {
                setTimeout(() => window.location.href = '/', 3000);
            }
        }

        // Handle direct link from email
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const urlEmail = params.get('email');
            const urlOtp = params.get('otp');
            const urlStep = params.get('step');

            if (urlEmail) {
                document.getElementById('email').value = urlEmail;
            }
            if (urlOtp) {
                document.getElementById('otp').value = urlOtp;
            }
            if (urlStep === 'verify' && urlEmail) {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                statusMsg.style.color = '#38bdf8';
                statusMsg.innerText = "Email prefilled. Please verify your OTP code.";
            }
        });
    </script>
</body>
</html>
