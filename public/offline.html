<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Mode - Fusion High</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 440px;
      padding: 32px;
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 8px 0;
      font-weight: 800;
    }
    p {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    button {
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">OFFLINE WORKSPACE</div>
    <h1>You are currently offline</h1>
    <p>
      Fusion High PWA is running in offline mode. Your cached study notes and previous pages remain accessible without active data connection.
    </p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
