name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  critical-path:
    name: Critical-path tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Run critical-path unit tests
        run: npm test

  client-build:
    name: Client typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci
      - name: Typecheck & build
        run: npm run build
        env:
          # Build should not require live API secrets
          VITE_API_URL: http://localhost:4000

  secrets-scan:
    name: Secrets hygiene scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan for accidental secrets
        run: node scripts/scan-secrets.js
